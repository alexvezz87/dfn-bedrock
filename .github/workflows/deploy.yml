name: 🚀 Deploy Remoto Bedrock via FTP

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: gd, zip, mysqli, mbstring, xml, curl

    - name: 📦 Install Composer Dependencies
      run: |
        composer install --no-ansi --no-dev --no-interaction --no-progress --optimize-autoloader --ignore-platform-reqs

    - name: 📦 Create Compressed TAR Archive
      run: |
        # Creiamo un unico archivio compresso (.tar.gz) escludendo la cartella uploads
        tar --exclude="web/app/uploads" -czf deploy.tar.gz vendor web config

    - name: 📂 Upload Single Archive via LFTP (Super Fast - 1 File Only)
      run: |
        sudo apt-get install -y --no-install-recommends lftp
        lftp -e "set ssl:verify-certificate no; set ftp:ssl-allow yes; set ftp:ssl-force no; set ftp:passive-mode yes; set net:timeout 60; set net:max-retries 3; put deploy.tar.gz; put scompatta.php; quit" -u "${{ secrets.FTP_USERNAME }}","${{ secrets.FTP_PASSWORD }}" "${{ secrets.FTP_SERVER }}"

    - name: 🚀 Trigger Remote Extraction
      run: |
        curl -k -L -sS --max-time 15 https://dfnprenotazioni.it/scompatta.php?t=202605300020 || curl -k -L -sS --max-time 15 http://dfnprenotazioni.it/scompatta.php?t=202605300020 || true
