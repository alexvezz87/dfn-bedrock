name: 🚀 Deploy Remoto Bedrock via FTP

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Build & Deploy
    runs-on: ubuntu-latest

    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 📂 Sync changed files via FTP (Delta Upload - 5 sec)
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: /
        port: 21
        security: loose
        passive: true
        exclude: |
          **/.git**
          **/.git*/**
          **/node_modules/**
          **/vendor/**
          web/app/uploads/**
          web/wp/**
          *.sql
          *.zip
          *.gz

