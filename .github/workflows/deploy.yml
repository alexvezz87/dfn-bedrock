name: 🚀 Deploy Remoto Bedrock via FTP

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: gd, zip, mysqli, mbstring, xml, curl

    - name: 📦 Install Composer Dependencies
      run: |
        composer install --no-ansi --no-dev --no-interaction --no-progress --optimize-autoloader --ignore-platform-reqs

    - name: 📦 Create Compressed TAR Archive
      run: |
        tar --exclude="web/app/uploads" --exclude="web/wp" --exclude="*.zip" --exclude="*.sql" --exclude="*.tar.gz" -czf deploy.tar.gz vendor web config
        ls -lh deploy.tar.gz

    - name: 📂 Install lftp
      run: sudo apt-get install -y lftp

    - name: 📂 Upload Archive via lftp
      env:
        FTP_SERVER: ${{ secrets.FTP_SERVER }}
        FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
        FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      run: |
        FTP_HOST=$(echo "$FTP_SERVER" | sed 's|^ftps\?://||' | sed 's|/.*||')
        echo "Connecting to: $FTP_HOST"

        lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_HOST" << 'EOF'
        set ssl:verify-certificate false
        set ftp:ssl-allow true
        set ftp:ssl-force false
        set ftp:passive-mode true
        set net:timeout 90
        set net:max-retries 5
        set net:reconnect-interval-base 15
        set net:reconnect-interval-multiplier 2
        put -O / deploy.tar.gz
        put -O / scompatta.php
        bye
        EOF

    - name: 🚀 Trigger Remote Extraction
      run: |
        curl -k -L -sS --max-time 30 "https://dfnprenotazioni.it/scompatta.php?t=202605300020" || \
        curl -k -L -sS --max-time 30 "http://dfnprenotazioni.it/scompatta.php?t=202605300020" || \
        echo "Extraction trigger non riuscito (non bloccante)"
