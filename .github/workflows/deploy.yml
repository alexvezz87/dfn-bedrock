name: 🚀 Deploy Remoto Bedrock via FTP

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3' # Allineato alla versione PHP locale/remota

    - name: 📦 Install Composer Dependencies
      run: |
        composer install --no-ansi --no-dev --no-interaction --no-plugins --no-progress --no-scripts --optimize-autoloader

    - name: 📦 Create Deployment TAR Archive
      run: |
        # Creiamo un archivio TAR standard ed escludiamo la cartella uploads
        # Il TAR preserva i file in modo pulito ed è scompattato via PHP PharData senza errori di permessi
        tar -cf deploy.tar vendor web --exclude="web/app/uploads/*"

    - name: 📂 Prepare Deployment Directory
      run: |
        # Creiamo una cartella pulita per caricare solo il TAR e lo script di estrazione
        mkdir deploy_dist
        mv deploy.tar deploy_dist/
        mv scompatta.php deploy_dist/

    - name: 📂 Sync files to Remote Server
      uses: SamKirkland/FTP-Deploy-Action@v4.4.0
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./deploy_dist/
        server-dir: ./
        timeout: 300000 # 5 minuti di timeout

    - name: 🚀 Trigger Remote Extraction and Self-Destruct
      run: |
        # Eseguiamo una chiamata HTTP sicura allo script per scompattare ed autodistruggersi
        # Usiamo -k per ignorare eventuali problemi di SSL temporanei e -L per seguire i reindirizzamenti
        curl -k -L -sS https://dfnprenotazioni.it/scompatta.php?t=202605300012 || curl -k -L -sS http://dfnprenotazioni.it/scompatta.php?t=202605300012
