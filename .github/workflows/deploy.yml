name: 🚀 Deploy Remoto Bedrock via FTP Single-Connection

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: gd, zip, mysqli, mbstring, xml, curl

    - name: 📦 Create Ultra-Compact Archive (700 KB)
      run: |
        tar --exclude="node_modules" --exclude="vendor" -czf deploy.tar.gz web/app/themes/dfn-theme config web/deploy-receiver.php web/scompatta.php scompatta.php
        ls -lh deploy.tar.gz

    - name: 📂 Upload Archive via Single-Connection FTP (1 Second)
      env:
        FTP_SERVER: ${{ secrets.FTP_SERVER }}
        FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
        FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      run: |
        HOST=$(echo "$FTP_SERVER" | sed -e 's|^ftp://||' -e 's|^ftps://||' -e 's|/*$||')
        echo "Uploading deploy.tar.gz to ftp://$HOST/..."
        curl --ftp-pasv --insecure --connect-timeout 20 --retry 3 --retry-delay 2 -T deploy.tar.gz -u "$FTP_USERNAME:$FTP_PASSWORD" "ftp://$HOST/deploy.tar.gz" || true
        curl --ftp-pasv --insecure --connect-timeout 20 --retry 3 --retry-delay 2 -T deploy.tar.gz -u "$FTP_USERNAME:$FTP_PASSWORD" "ftp://$HOST/public_html/deploy.tar.gz" || true
        curl --ftp-pasv --insecure --connect-timeout 20 --retry 3 --retry-delay 2 -T deploy.tar.gz -u "$FTP_USERNAME:$FTP_PASSWORD" "ftp://$HOST/public_html/web/deploy.tar.gz" || true

    - name: 🚀 Trigger Remote Extraction
      run: |
        curl -k -L -sS --max-time 15 https://dfnprenotazioni.it/scompatta.php?t=202605300020 || curl -k -L -sS --max-time 15 https://dfnprenotazioni.it/web/scompatta.php?t=202605300020 || true
