name: 🚀 Deploy Remoto Bedrock via FTP

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: gd, zip, mysqli, mbstring, xml, curl

    - name: 📦 Install Composer Dependencies
      run: |
        composer install --no-ansi --no-dev --no-interaction --no-progress --optimize-autoloader --ignore-platform-reqs

    - name: 📦 Create Compressed TAR Archive
      run: |
        # Creiamo un archivio compresso escludendo uploads, WordPress Core, zip e file sql per ridurre il pacchetto a 5MB
        tar --exclude="web/app/uploads" --exclude="web/wp" --exclude="*.zip" --exclude="*.sql" --exclude="*.tar.gz" -czf deploy.tar.gz vendor web config

    - name: 📂 Upload Archive via Python FTP (Instant & Reliable)
      env:
        FTP_SERVER: ${{ secrets.FTP_SERVER }}
        FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
        FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      run: |
        python3 -c "
        import os, sys, ftplib

        server = os.environ['FTP_SERVER'].replace('ftp://', '').replace('ftps://', '').strip('/')
        user = os.environ['FTP_USERNAME']
        password = os.environ['FTP_PASSWORD']

        print(f'Connecting to FTP server: {server}...')
        try:
            ftp = ftplib.FTP(server, timeout=120)
            ftp.login(user, password)
            ftp.set_pasv(True)
            print('Logged in successfully to FTP.')

            for fname in ['deploy.tar.gz', 'scompatta.php']:
                if os.path.exists(fname):
                    size_mb = os.path.getsize(fname) / (1024 * 1024)
                    print(f'Uploading {fname} ({size_mb:.2f} MB)...')
                    with open(fname, 'rb') as f:
                        ftp.storbinary(f'STOR {fname}', f, blocksize=65536)
                    print(f'Finished uploading {fname}.')

            ftp.quit()
            print('All files uploaded successfully!')
        except Exception as e:
            print(f'FTP Upload Error: {e}')
            sys.exit(1)
        "

    - name: 🚀 Trigger Remote Extraction
      run: |
        curl -k -L -sS --max-time 15 https://dfnprenotazioni.it/scompatta.php?t=202605300020 || curl -k -L -sS --max-time 15 http://dfnprenotazioni.it/scompatta.php?t=202605300020 || true
