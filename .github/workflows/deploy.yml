name: 🚀 Deploy Remoto Bedrock via FTP

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3' # Allineato alla versione PHP locale/remota

    - name: 📦 Install Composer Dependencies
      run: |
        composer install --no-ansi --no-dev --no-interaction --no-progress --optimize-autoloader

    - name: 📦 Create Compressed TAR Archive
      run: |
        # Creiamo un archivio TAR compresso (.tar.gz) escludendo la cartella uploads per velocità e sicurezza
        # Il TAR preserva i file/symlink in modo pulito ed è solo ~25MB compresso!
        tar --exclude="web/app/uploads" -czf deploy.tar.gz vendor web config

    - name: 📂 Upload Files via curl FTP (Secure & Fast)
      run: |
        # Usiamo curl per caricare in modo sicuro SOLO i due file necessari.
        # Questo garantisce che nessun altro file sul server remoto (come gli upload esistenti) venga cancellato!
        curl -T deploy.tar.gz ftp://${{ secrets.FTP_SERVER }}/ --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}"
        curl -T scompatta.php ftp://${{ secrets.FTP_SERVER }}/ --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}"

    - name: 🚀 Trigger Remote Extraction and Self-Destruct
      run: |
        # Eseguiamo una chiamata HTTP sicura allo script per scompattare ed autodistruggersi
        # Usiamo -k per ignorare eventuali problemi di SSL temporanei e -L per seguire i reindirizzamenti
        curl -k -L -sS https://dfnprenotazioni.it/scompatta.php?t=202605300020 || curl -k -L -sS http://dfnprenotazioni.it/scompatta.php?t=202605300020
