name: 🚀 Deploy Remoto Bedrock via FTP

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: gd, zip, mysqli, mbstring, xml, curl

    - name: 📦 Install Composer Dependencies
      run: |
        composer install --no-ansi --no-dev --no-interaction --no-progress --optimize-autoloader --ignore-platform-reqs

    - name: 📦 Create Compressed TAR Archive
      run: |
        # Creiamo un unico archivio compresso (.tar.gz) escludendo la cartella uploads
        tar --exclude="web/app/uploads" -czf deploy.tar.gz vendor web config

    - name: 📂 Upload Archive via Python FTP (Instant & Zero-Dependency)
      env:
        FTP_SERVER: ${{ secrets.FTP_SERVER }}
        FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
        FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      run: |
        python3 -c "
        import ftplib, os, sys
        raw_server = os.environ.get('FTP_SERVER', '').strip()
        server = raw_server.replace('ftp://', '').replace('ftps://', '').rstrip('/')
        port = 21
        if ':' in server:
            server, port_str = server.split(':')
            port = int(port_str)
        user = os.environ.get('FTP_USERNAME', '').strip()
        passwd = os.environ.get('FTP_PASSWORD', '').strip()

        print(f'Connecting to FTP server \"{server}\" on port {port}...')
        ftp = None
        try:
            print('Attempting FTPS (FTP over TLS)...')
            ftps = ftplib.FTP_TLS(timeout=60)
            ftps.connect(server, port)
            ftps.login(user, passwd)
            ftps.prot_p()
            ftps.set_pasv(True)
            ftp = ftps
            print('Connected via FTPS successfully!')
        except Exception as e:
            print(f'FTPS failed ({e}), falling back to standard FTP...')
            ftp = ftplib.FTP(timeout=60)
            ftp.connect(server, port)
            ftp.login(user, passwd)
            ftp.set_pasv(True)
            print('Connected via standard FTP successfully!')

        for fname in ['deploy.tar.gz', 'scompatta.php']:
            if os.path.exists(fname):
                size = os.path.getsize(fname) / (1024*1024)
                print(f'Uploading {fname} ({size:.1f} MB)...')
                with open(fname, 'rb') as f:
                    ftp.storbinary(f'STOR {fname}', f, blocksize=1024*1024)
                print(f'Uploaded {fname} successfully!')

        ftp.quit()
        print('All files uploaded successfully!')
        "

    - name: 🚀 Trigger Remote Extraction
      run: |
        curl -k -L -sS --max-time 15 https://dfnprenotazioni.it/scompatta.php?t=202605300020 || curl -k -L -sS --max-time 15 http://dfnprenotazioni.it/scompatta.php?t=202605300020 || true
