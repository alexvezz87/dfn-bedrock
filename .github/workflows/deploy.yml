name: 🚀 Deploy Remoto Bedrock via FTP

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3' # Allineato alla versione PHP locale/remota

    - name: 📦 Install Composer Dependencies
      run: |
        composer install --no-ansi --no-dev --no-interaction --no-plugins --no-progress --no-scripts --optimize-autoloader

    - name: 📂 Sync files to Remote Server
      uses: SamKirkland/FTP-Deploy-Action@v4.4.0
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        timeout: 300000 # 5 minuti di timeout per evitare "Timeout (control socket)"
        log-level: verbose
        # Escludiamo file locali non necessari in produzione per sicurezza e pulizia
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          .env
          .env.example
          README.md
          composer.json
          composer.lock
          backup_dfn_*.sql
          tests/
          phpunit.xml*
          web/app/uploads/**
          vendor/**
          web/wp/**
          web/app/debug.log
          web/app/upgrade/**
          web/app/upgrade-temp-backup/**
          web/app/plugins/child-theme-configurator/**
          web/app/plugins/cookiebot/**
          web/app/plugins/duplicate-post/**
          web/app/plugins/elementor/**
          web/app/plugins/font-awesome/**
          web/app/plugins/google-site-kit/**
          web/app/plugins/maintenance/**
          web/app/plugins/pojo-accessibility/**
          web/app/plugins/really-simple-ssl/**
          web/app/plugins/redirection/**
          web/app/plugins/side-cart-woocommerce/**
          web/app/plugins/woo-order-export-lite/**
          web/app/plugins/woo-stripe-payment/**
          web/app/plugins/woocommerce/**
          web/app/plugins/woocommerce-gateway-stripe/**
          web/app/plugins/woolentor-addons/**
          web/app/plugins/wordpress-seo/**
          web/app/plugins/wp-crontrol/**
          web/app/plugins/wp-fastest-cache/**
          web/app/plugins/wp-mail-smtp/**
          web/app/plugins/wp-migrate-db/**
