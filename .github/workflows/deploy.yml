name: 🚀 Deploy Remoto Bedrock via HTTPS

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: gd, zip, mysqli, mbstring, xml, curl

    - name: 📦 Install Composer Dependencies
      run: |
        composer install --no-ansi --no-dev --no-interaction --no-progress --optimize-autoloader --ignore-platform-reqs

    - name: 📦 Create Compressed TAR Archive
      run: |
        tar --exclude="web/app/uploads" --exclude="web/wp" --exclude="*.zip" --exclude="*.sql" --exclude="*.tar.gz" -czf deploy.tar.gz vendor web config
        ls -lh deploy.tar.gz

    - name: 📂 Upload & Deploy via HTTPS POST
      env:
        DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
      run: |
        echo "Uploading deploy.tar.gz to server via HTTPS..."
        HTTP_STATUS=$(curl -k -s -o /tmp/deploy_response.txt -w "%{http_code}" \
          --max-time 120 \
          --retry 3 \
          --retry-delay 10 \
          -X POST \
          -F "deploy_archive=@deploy.tar.gz;type=application/gzip" \
          "https://dfnprenotazioni.it/deploy-receiver.php?token=${DEPLOY_TOKEN}")

        echo "HTTP Status: $HTTP_STATUS"
        echo "Server response:"
        cat /tmp/deploy_response.txt

        if [ "$HTTP_STATUS" != "200" ]; then
          echo "Deploy FAILED with status $HTTP_STATUS"
          exit 1
        fi

        echo "Deploy completed successfully!"
