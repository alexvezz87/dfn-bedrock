name: 🚀 Deploy Remoto Bedrock via HTTPS

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: gd, zip, mysqli, mbstring, xml, curl

    - name: 📦 Install Composer Dependencies
      run: |
        composer install --no-ansi --no-dev --no-interaction --no-progress --optimize-autoloader --ignore-platform-reqs

    - name: 📦 Create Compressed TAR Archive (1.5 MB)
      run: |
        tar --exclude="vendor" --exclude="web/app/themes/*/vendor" --exclude="web/app/uploads" --exclude="web/wp" --exclude="*.zip" --exclude="*.sql" --exclude="*.tar.gz" -czf deploy.tar.gz web config
        ls -lh deploy.tar.gz

    - name: 🚀 Deploy via HTTPS (Port 443 - Instant & Unblockable)
      env:
        DEPLOY_TOKEN: 6kNQApo-1nSvRYQkbtgYi4dVD3BcbwhwRyTm4vZ8r3c
      run: |
        echo "Uploading deploy package via HTTPS (Port 443)..."
        HTTP_STATUS=$(curl -k -s -o /tmp/deploy_res.txt -w "%{http_code}" \
          --max-time 60 \
          -X POST \
          -F "deploy_archive=@deploy.tar.gz;type=application/gzip" \
          "https://www.dfnprenotazioni.it/deploy-receiver.php?token=${DEPLOY_TOKEN}")

        echo "HTTP Status Code: $HTTP_STATUS"
        echo "Response:"
        cat /tmp/deploy_res.txt

        if [ "$HTTP_STATUS" != "200" ]; then
          echo "Deploy FAILED!"
          exit 1
        fi

        echo "Deploy succeeded!"
